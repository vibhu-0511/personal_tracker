<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mastery Map · DSA v2 · Candidate Master Protocol v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --bg-card: #121214;
    --bg-card-hover: #1a1a1d;
    --bg-side: #0d0d0f;
    --border: #222225;
    --border-hover: #3a3a40;
    --text: #e8e8ea;
    --text-dim: #8a8a90;
    --text-faint: #5a5a60;
    --accent: #f0f0f2;

    --tier-1: #5eead4;
    --tier-2: #a78bfa;
    --tier-3: #60a5fa;
    --tier-4: #fbbf24;
    --tier-5: #f472b6;
    --tier-6: #fb923c;
    --tier-7: #f87171;

    --diff-easy: #5eead4;
    --diff-med: #fbbf24;
    --diff-hard: #fb923c;
    --diff-gm: #f87171;

    /* per-tab theme colors */
    --theme-arrays: #5eead4;
    --theme-recursion: #c4b5fd;
    --theme-twoptr: #7dd3fc;
    --theme-binsearch: #fbbf24;
    --theme-sorting: #fb923c;
    --theme-stack: #f472b6;
    --theme-graph: #60a5fa;
    --theme-dp: #a78bfa;

    --theme-ll: #fb7185;
    --theme-string: #34d399;
    --theme-tree: #facc15;
    --theme-heap: #f97316;
    --theme-segtree: #818cf8;

    --theme-greedy: #fde047;
    --theme-math: #22d3ee;
    --theme-advanced: #ec4899;

    --theme-arsenal: #a3e635;
    --theme-patterns: #2dd4bf;
    --theme-roadmap: #fde047;
    --theme-confusion: #f97316;
    --theme-bugs: #ef4444;
    --theme-cheatsheet: #06b6d4;
    --theme-log: #a78bfa;

    --theme: var(--theme-dp);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(167, 139, 250, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(94, 234, 212, 0.05) 0%, transparent 40%);
  }

  /* Layout: sidebar + main */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .brand {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .brand h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand h1 .accent { color: var(--theme); transition: color 0.2s; }
  .brand .subtitle {
    color: var(--text-faint);
    font-size: 10px;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .nav-group {
    padding: 8px 0;
  }
  .nav-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 6px 20px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    border-left: 2px solid transparent;
    transition: all 0.12s;
    user-select: none;
  }
  .nav-item:hover { color: var(--text); background: var(--bg-card); }
  .nav-item.active {
    color: var(--theme);
    border-left-color: var(--theme);
    background: var(--bg-card);
    font-weight: 600;
  }
  .nav-count {
    font-size: 10px;
    color: var(--text-faint);
    background: var(--bg);
    padding: 2px 7px;
    border-radius: 10px;
  }
  .nav-item.active .nav-count { color: var(--text-dim); }

  /* Main area */
  .main {
    padding: 32px 32px 48px;
    max-width: 1400px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .main-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .main-title .accent { color: var(--theme); transition: color 0.2s; }
  .main-sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .stats {
    display: flex;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
  }
  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .stat .num { color: var(--theme); font-weight: 700; font-size: 15px; margin-left: 6px; transition: color 0.2s; }
  .stat.done .num { color: var(--tier-1); }
  .stat.remaining .num { color: var(--tier-4); }
  .stat.global { background: transparent; border-style: dashed; }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search {
    flex: 1;
    min-width: 240px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search:focus { border-color: var(--theme); }
  .search::placeholder { color: var(--text-faint); }

  .filters { display: flex; gap: 6px; }
  .filter-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .filter-btn.active {
    background: var(--theme);
    color: var(--bg);
    border-color: var(--theme);
    font-weight: 600;
  }

  .legend {
    display: flex;
    gap: 18px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .layer {
    margin-bottom: 36px;
  }
  .layer-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
  }
  .layer-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    color: var(--bg);
  }
  .tier-1 .layer-label { background: var(--tier-1); }
  .tier-2 .layer-label { background: var(--tier-2); }
  .tier-3 .layer-label { background: var(--tier-3); }
  .tier-4 .layer-label { background: var(--tier-4); }
  .tier-5 .layer-label { background: var(--tier-5); }
  .tier-6 .layer-label { background: var(--tier-6); }
  .tier-7 .layer-label { background: var(--tier-7); }
  .layer-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
  }
  .layer-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    border-left: 3px solid var(--border);
  }
  .tier-1 .card { border-left-color: var(--tier-1); }
  .tier-2 .card { border-left-color: var(--tier-2); }
  .tier-3 .card { border-left-color: var(--tier-3); }
  .tier-4 .card { border-left-color: var(--tier-4); }
  .tier-5 .card { border-left-color: var(--tier-5); }
  .tier-6 .card { border-left-color: var(--tier-6); }
  .tier-7 .card { border-left-color: var(--tier-7); }
  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }
  .card.done { opacity: 0.55; }
  .card.done .card-title { text-decoration: line-through; text-decoration-color: var(--text-faint); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card-title {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .card-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.4;
    flex-shrink: 0;
  }
  .card-check {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border-hover);
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .card-check:hover { border-color: var(--text-dim); }
  .card.done .card-check {
    background: var(--tier-1);
    border-color: var(--tier-1);
    position: relative;
  }
  .card.done .card-check::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
  }
  .card-desc {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.45;
    margin-bottom: 10px;
  }
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 10px;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .tag.diff-easy { background: rgba(94, 234, 212, 0.12); color: var(--diff-easy); border-color: rgba(94, 234, 212, 0.3); }
  .tag.diff-med { background: rgba(251, 191, 36, 0.12); color: var(--diff-med); border-color: rgba(251, 191, 36, 0.3); }
  .tag.diff-hard { background: rgba(251, 146, 60, 0.12); color: var(--diff-hard); border-color: rgba(251, 146, 60, 0.3); }
  .tag.diff-gm { background: rgba(248, 113, 113, 0.15); color: var(--diff-gm); border-color: rgba(248, 113, 113, 0.35); font-weight: 700; }
  .tag.signal { color: var(--text); }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .prereq {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    flex: 1;
  }
  .prereq span { color: var(--text-dim); }
  .confidence {
    display: flex;
    gap: 3px;
  }
  .conf-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1px solid var(--border-hover);
    cursor: pointer;
    transition: all 0.12s;
  }
  .conf-dot:hover { border-color: var(--text-dim); }
  .conf-dot.filled {
    background: var(--theme);
    border-color: var(--theme);
  }

  .card-detail {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .card.expanded .card-detail { display: block; }
  .recurrence {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text);
    margin-bottom: 10px;
    white-space: pre-wrap;
  }
  .detail-row {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
    line-height: 1.5;
  }
  .detail-row strong { color: var(--text); margin-right: 6px; }

  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    line-height: 1.6;
  }
  kbd {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    color: var(--text-dim);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 20px; }
  }

  /* ========== ARSENAL TAB STYLES ========== */
  .ars-category {
    margin-bottom: 40px;
  }
  .ars-category-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
    padding: 10px 14px;
    background: var(--bg-card);
    border-left: 3px solid var(--theme-arsenal);
    border-radius: 4px;
  }
  .ars-category-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--theme-arsenal);
    color: var(--bg);
  }
  .ars-category-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
  }
  .ars-category-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  .ars-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 12px;
  }

  .ars-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid var(--border);
  }
  .ars-card:hover { background: var(--bg-card-hover); border-color: var(--border-hover); transform: translateY(-1px); }
  .ars-card.done { opacity: 0.55; }
  .ars-card.done .ars-card-title { text-decoration: line-through; text-decoration-color: var(--text-faint); }

  .ars-card.tier-S { border-left-color: #f87171; }
  .ars-card.tier-A { border-left-color: #fb923c; }
  .ars-card.tier-B { border-left-color: #60a5fa; }
  .ars-card.tier-C { border-left-color: #8a8a90; }

  .ars-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .ars-card-title {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.3;
  }
  .ars-card-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    margin-right: 6px;
  }
  .ars-tier-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .ars-tier-badge.tier-S { background: #f87171; color: var(--bg); }
  .ars-tier-badge.tier-A { background: #fb923c; color: var(--bg); }
  .ars-tier-badge.tier-B { background: #60a5fa; color: var(--bg); }
  .ars-tier-badge.tier-C { background: #8a8a90; color: var(--bg); }

  .ars-card-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .ars-card-meta .k { color: var(--text-faint); }
  .ars-card-meta .v { color: var(--text); }

  .ars-card-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .ars-card-check {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border-hover);
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    position: relative;
  }
  .ars-card-check:hover { border-color: var(--text-dim); }
  .ars-card.done .ars-card-check {
    background: var(--tier-1);
    border-color: var(--tier-1);
  }
  .ars-card.done .ars-card-check::after {
    content: '✓';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--bg); font-size: 12px; font-weight: 700;
  }

  .ars-card-detail {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .ars-card.expanded .ars-card-detail { display: block; }

  .ars-code {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre;
    overflow-x: auto;
    margin: 8px 0;
    max-height: 420px;
  }
  .ars-code::-webkit-scrollbar { height: 6px; width: 6px; }
  .ars-code::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }

  .ars-gotchas {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--diff-med);
    background: rgba(251, 191, 36, 0.08);
    border-left: 2px solid var(--diff-med);
    padding: 8px 10px;
    border-radius: 4px;
    line-height: 1.5;
    margin: 8px 0;
  }

  .ars-applied-in {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .ars-applied-in strong { color: var(--text); }


  /* ========== PATTERN TAB STYLES ========== */
  .pat-signal {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--theme-patterns);
    background: rgba(45, 212, 191, 0.08);
    border-left: 3px solid var(--theme-patterns);
    padding: 8px 12px;
    border-radius: 4px;
    margin: 8px 0;
    line-height: 1.5;
    font-weight: 600;
  }
  .pat-signal::before {
    content: 'SIGNAL → ';
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    opacity: 0.7;
  }
  .pat-idea {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--text);
    margin: 6px 0 10px;
    line-height: 1.5;
  }
  .pat-idea::before {
    content: 'IDEA · ';
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }

  .pat-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .pat-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.12s;
  }
  .pat-chip:hover { border-color: var(--theme-patterns); color: var(--theme-patterns); }
  .pat-chip.algo-chip { color: var(--text-dim); }
  .pat-chip.unresolved { opacity: 0.5; cursor: default; }
  .pat-chip.unresolved:hover { border-color: var(--border); color: var(--text-dim); }

  .algo-related-patterns {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .algo-related-patterns .label {
    color: var(--theme-patterns);
    font-weight: 600;
    margin-right: 4px;
  }


  /* ========== ROADMAP STYLES ========== */
  .rm-header {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .rm-header h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .rm-current-phase {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--theme-roadmap);
    font-weight: 700;
  }
  .rm-phase-selector {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .rm-phase-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .rm-phase-btn:hover { border-color: var(--theme-roadmap); color: var(--text); }
  .rm-phase-btn.active {
    background: var(--theme-roadmap);
    color: var(--bg);
    border-color: var(--theme-roadmap);
    font-weight: 700;
  }
  .rm-rating-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    width: 90px;
    outline: none;
  }
  .rm-rating-input:focus { border-color: var(--theme-roadmap); }

  .rm-timeline {
    position: relative;
    padding-left: 28px;
  }
  .rm-timeline::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 12px;
    bottom: 12px;
    width: 2px;
    background: var(--border);
  }

  .rm-phase {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 16px;
    position: relative;
    transition: all 0.15s;
  }
  .rm-phase::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 22px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    z-index: 1;
  }
  .rm-phase.current::before {
    background: var(--theme-roadmap);
    border-color: var(--theme-roadmap);
    box-shadow: 0 0 0 4px rgba(253, 224, 71, 0.2);
  }
  .rm-phase.done::before {
    background: var(--tier-1);
    border-color: var(--tier-1);
  }
  .rm-phase.current { border-color: var(--theme-roadmap); }

  .rm-phase-head {
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .rm-phase-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--theme-roadmap);
    letter-spacing: 0.04em;
  }
  .rm-phase-name {
    font-size: 17px;
    font-weight: 700;
    margin: 2px 0 4px;
  }
  .rm-phase-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .rm-phase-meta .target { color: var(--theme-roadmap); font-weight: 600; }
  .rm-progress-ring {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: right;
  }
  .rm-progress-ring .done { color: var(--tier-1); font-weight: 700; font-size: 16px; }
  .rm-progress-ring .pct { color: var(--text-faint); }

  .rm-phase-body {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .rm-phase.expanded .rm-phase-body { display: block; }

  .rm-goal {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.5;
    font-style: italic;
    padding-left: 10px;
    border-left: 3px solid var(--theme-roadmap);
  }

  .rm-section {
    margin-bottom: 14px;
  }
  .rm-section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .rm-topic-group {
    margin-bottom: 10px;
  }
  .rm-topic-group-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .rm-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .rm-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.12s;
  }
  .rm-chip:hover { border-color: var(--theme-roadmap); color: var(--text); }
  .rm-chip.done { background: rgba(94, 234, 212, 0.1); color: var(--tier-1); border-color: rgba(94, 234, 212, 0.3); }
  .rm-chip.unresolved { opacity: 0.4; cursor: default; }
  .rm-chip.unresolved:hover { border-color: var(--border); color: var(--text-dim); }

  .rm-list {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.7;
    padding-left: 18px;
  }
  .rm-list li { margin-bottom: 2px; }

  .rm-checkpoints {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .rm-checkpoint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    text-decoration: none;
    transition: all 0.12s;
  }
  .rm-checkpoint:hover { border-color: var(--theme-roadmap); color: var(--theme-roadmap); }

  .rm-weekly-btn {
    margin-top: 10px;
    background: var(--theme-roadmap);
    color: var(--bg);
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .rm-weekly-btn:hover { opacity: 0.85; }

  /* ========== POLISH: NEXT-UP + EXPORT ========== */
  .polish-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .polish-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .polish-btn:hover { border-color: var(--theme); color: var(--theme); }

  .polish-modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .polish-modal-backdrop.open { display: flex; }
  .polish-modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    max-width: 640px;
    max-height: 80vh;
    width: 100%;
    overflow-y: auto;
    position: relative;
  }
  .polish-modal h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    margin-bottom: 14px;
    color: var(--theme);
  }
  .polish-modal-close {
    position: absolute;
    top: 12px; right: 14px;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
  }
  .polish-textarea {
    width: 100%;
    min-height: 200px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    resize: vertical;
    outline: none;
    line-height: 1.4;
  }
  .polish-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  .polish-action-btn {
    background: var(--theme);
    color: var(--bg);
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .polish-action-btn.secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .next-up-item {
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--theme);
    border-radius: 4px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .next-up-item:hover { border-color: var(--theme); transform: translateX(2px); }
  .next-up-item .title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .next-up-item .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); }

  .global-search-result {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
  }
  .global-search-result:hover { background: var(--bg); }
  .global-search-result .title { font-size: 13px; font-weight: 600; }
  .global-search-result .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 2px;
  }
  .global-search-group {
    margin-bottom: 16px;
  }
  .global-search-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--theme);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 6px 12px;
    background: var(--bg);
    border-radius: 4px;
    margin-bottom: 4px;
  }


  /* ========== DEPTH LADDER ========== */
  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(253, 224, 71, 0.08);
    border: 1px solid rgba(253, 224, 71, 0.3);
    color: var(--theme-roadmap);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 10px;
  }
  .dl-btn:hover {
    background: rgba(253, 224, 71, 0.15);
    border-color: var(--theme-roadmap);
  }
  .dl-btn::before {
    content: '🪜';
    font-size: 11px;
  }
  .dl-preview-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
    padding: 8px 12px;
    background: var(--bg);
    border-left: 2px solid var(--theme-roadmap);
    border-radius: 4px;
  }
  .dl-preview-meta strong { color: var(--text); }


  /* ========== CONFUSION MATRIX ========== */
  .cm-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--theme-confusion);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .cm-card:hover { background: var(--bg-card-hover); }
  .cm-card.done { opacity: 0.55; }
  .cm-signal {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--theme-confusion);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .cm-signal::before {
    content: 'WHEN YOU SEE → ';
    font-size: 10px;
    font-weight: 700;
    opacity: 0.7;
    letter-spacing: 0.08em;
  }
  .cm-row {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 10px;
    margin-bottom: 6px;
    align-items: start;
  }
  .cm-row .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .cm-row .wrong-label { color: var(--diff-gm); }
  .cm-row .correct-label { color: var(--tier-1); }
  .cm-row .why-label { color: var(--text-faint); }
  .cm-row .val {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
  }
  .cm-row .val.wrong { color: #fca5a5; }
  .cm-row .val.correct { color: var(--tier-1); }
  .cm-row .val.why {
    color: var(--text-dim);
    font-style: italic;
    font-size: 11px;
  }
  .cm-refs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .cm-ref {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .cm-ref:hover { border-color: var(--theme-confusion); color: var(--theme-confusion); }
  .cm-ref.unresolved { opacity: 0.5; cursor: default; }

  /* ========== BUG CATALOG ========== */
  .bug-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--theme-bugs);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bug-card:hover { background: var(--bg-card-hover); }
  .bug-card.done { opacity: 0.55; }
  .bug-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--theme-bugs);
    margin-bottom: 6px;
  }
  .bug-title::before { content: '🐛 '; }
  .bug-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 8px;
    margin-bottom: 5px;
    font-size: 11px;
    line-height: 1.5;
  }
  .bug-row .k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .bug-row .v { color: var(--text); }
  .bug-row .v.ex {
    font-family: 'JetBrains Mono', monospace;
    color: #fca5a5;
    background: rgba(239, 68, 68, 0.08);
    padding: 4px 8px;
    border-radius: 3px;
  }
  .bug-row .v.fix {
    font-family: 'JetBrains Mono', monospace;
    color: var(--tier-1);
    background: rgba(94, 234, 212, 0.05);
    padding: 4px 8px;
    border-radius: 3px;
  }

  /* ========== CHEAT SHEET ========== */
  .cs-section { margin-bottom: 32px; }
  .cs-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--theme-cheatsheet);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .cs-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }
  .cs-table th, .cs-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .cs-table th {
    color: var(--theme-cheatsheet);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 10px;
    background: var(--bg);
  }
  .cs-table td {
    color: var(--text);
  }
  .cs-table td:first-child {
    font-weight: 600;
    color: var(--text);
  }
  .cs-table tr:hover td { background: var(--bg-card-hover); }

  /* ========== WHEN NOT TO USE on patterns ========== */
  .pat-when-not {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #fca5a5;
    background: rgba(239, 68, 68, 0.06);
    border-left: 2px solid var(--diff-gm);
    padding: 6px 10px;
    border-radius: 4px;
    margin: 6px 0;
    line-height: 1.5;
  }
  .pat-when-not::before {
    content: 'DON\'T USE WHEN → ';
    font-size: 10px;
    font-weight: 700;
    opacity: 0.8;
    letter-spacing: 0.06em;
  }


  /* ========== PROBLEM LOG ========== */
  .log-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .log-add-btn {
    background: var(--theme-log);
    color: var(--bg);
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .log-add-btn:hover { opacity: 0.85; }
  .log-search {
    flex: 1;
    min-width: 180px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .log-search:focus { border-color: var(--theme-log); }
  .log-filter {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }
  .log-filter option { background: var(--bg); color: var(--text); }
  .log-filter:focus { border-color: var(--theme-log); }

  .log-export-btn, .log-import-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }
  .log-export-btn:hover, .log-import-btn:hover {
    border-color: var(--theme-log);
    color: var(--theme-log);
  }

  .log-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    padding: 8px 12px;
    background: var(--bg-card);
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .log-stats strong { color: var(--text); margin: 0 4px; }
  .log-stats .done-c { color: var(--tier-1); }
  .log-stats .todo-c { color: var(--diff-med); }
  .log-stats .skip-c { color: var(--text-faint); }

  .log-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 16px;
  }
  .log-tag-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg-card);
    color: var(--text-dim);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.12s;
  }
  .log-tag-chip:hover { border-color: var(--theme-log); color: var(--theme-log); }
  .log-tag-chip.active {
    background: var(--theme-log);
    color: var(--bg);
    border-color: var(--theme-log);
  }
  .log-tag-chip .count {
    opacity: 0.6;
    margin-left: 4px;
  }

  .log-table {
    display: grid;
    gap: 6px;
  }

  .log-entry {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.12s;
    display: grid;
    grid-template-columns: 120px 1fr auto auto;
    gap: 10px;
    align-items: center;
  }
  .log-entry:hover { background: var(--bg-card-hover); }
  .log-entry.expanded { border-color: var(--theme-log); }

  .log-entry.status-solved { border-left: 3px solid var(--tier-1); }
  .log-entry.status-upsolved { border-left: 3px solid #5eead4; }
  .log-entry.status-attempted { border-left: 3px solid var(--diff-med); }
  .log-entry.status-todo { border-left: 3px solid var(--text-faint); }
  .log-entry.status-giving-up { border-left: 3px solid var(--diff-gm); opacity: 0.7; }

  .log-pid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--theme-log);
  }
  .log-title-col {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-title-col .ptag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-left: 6px;
    padding: 1px 6px;
    background: var(--bg);
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  .log-diff {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .log-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--bg);
  }

  .log-entry-body {
    display: none;
    grid-column: 1 / -1;

<script>
/* ===== Mastery Map cloud sync (Supabase) ===== */
(function () {
  var SUPABASE_URL = 'https://placeholder.supabase.co';
  var SUPABASE_ANON_KEY = 'placeholder-anon-key';
  var DATA_KEY = 'dsa_mastery_v1';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var nativeSet = localStorage.setItem.bind(localStorage);
  var nativeRemove = localStorage.removeItem.bind(localStorage);
  var pill;

  function ours(k) { return /^(mastery_|roadmap_)/.test(k); }

  function snapshot() {
    var out = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (ours(k)) out[k] = localStorage.getItem(k);
    }
    return out;
  }

  function flash(ok) {
    if (!pill) return;
    pill.textContent = ok ? '✓ saved to cloud' : '⚠ save failed';
    pill.style.color = ok ? '#7CFFB2' : '#ff6b6b';
    pill.style.opacity = '1';
    clearTimeout(pill._t);
    pill._t = setTimeout(function () { pill.style.opacity = '0'; }, 1800);
  }

  var timer = null;
  function schedulePush(delay) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      sb.auth.getUser().then(function (r) {
        var uid = r.data && r.data.user && r.data.user.id;
        if (!uid) return;
        sb.from('kv_store').upsert({
          user_id: uid, key: DATA_KEY, value: snapshot(), updated_at: new Date().toISOString(),
        }).then(function (res) { flash(!res.error); }).catch(function () { flash(false); });
      });
    }, delay == null ? 700 : delay);
  }

  // On sign-in (session is shared with the main Forge app via localStorage,
  // same origin — no separate login here), pull the cloud snapshot once.
  // Note: onAuthStateChange fires INITIAL_SESSION on every page load (not just
  // sign-in), so this must only reload when a pull actually changed something.
  sb.auth.onAuthStateChange(function (event, session) {
    if (!session) {
      if (pill) {
        pill.textContent = '⚠ not signed in — not syncing';
        pill.style.color = '#ff6b6b';
        pill.style.opacity = '1';
      }
      return;
    }
    sb.from('kv_store').select('value').eq('key', DATA_KEY).maybeSingle().then(function (res) {
      var cloud = res.data && res.data.value;
      if (cloud && Object.keys(cloud).length) {
        var changed = false;
        for (var k in cloud) {
          if (Object.prototype.hasOwnProperty.call(cloud, k) && ours(k) && localStorage.getItem(k) !== cloud[k]) {
            nativeSet(k, cloud[k]);
            changed = true;
          }
        }
        if (changed) location.reload();
      } else {
        schedulePush(0); // nothing in the cloud yet for this account — seed it
      }
    });
  });

  localStorage.setItem = function (key, val) { nativeSet(key, val); schedulePush(); };
  localStorage.removeItem = function (key) { nativeRemove(key); schedulePush(); };

  document.addEventListener('DOMContentLoaded', function () {
    pill = document.createElement('div');
    pill.style.cssText = 'position:fixed;bottom:12px;right:14px;z-index:99999;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 10px;border-radius:8px;background:#121214;border:1px solid #2a2a2e;opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(pill);
  });

  window.__masterySync = { snapshot: snapshot, saveNow: function () { schedulePush(0); } };
})();
</script>

void push(long v) {

    int i = heapSz++;
    while (i > 0) {

        long t = heap[p]; heap[p] = heap[i]; heap[i] = t;
        i = p;

    long top = heap[0];
    heap[0] = heap[--heapSz];

        if (l < heapSz && heap[l] < heap[m]) m = l;
        if (r < heapSz && heap[r] < heap[m]) m = r;
        if (m == i) break;
        long t = heap[m]; heap[m] = heap[i]; heap[i] = t;
        i = m;

        long lo = (bitShift > 0 && i - wordShift - 1 >= 0) ? dp[i - wordShift - 1] : 0;

/* ==========================================================
   STATE
   ========================================================== */
const STORAGE_KEY = 'mastery_map_v2';  // preserve graph/DP progress
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let currentTab = localStorage.getItem('mastery_tab') || 'dp';

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function getCardState(tab, title) {
  const key = `${tab}::${title}`;
  return state[key] || { done: false, confidence: 0, expanded: false };
}

function setCardState(tab, title, patch) {
  const key = `${tab}::${title}`;
  state[key] = { ...getCardState(tab, title), ...patch };
  save();
}

function getTab(id) { return TABS.find(t => t.id === id); }
function getData() { return getTab(currentTab).data; }
function getLayers() { return getTab(currentTab).layers; }
function getTheme() { return getTab(currentTab).theme; }

/* ==========================================================
   RENDER
   ========================================================== */
function renderNav() {
  const nav = document.getElementById('nav');
  const tabCounts = {};
  let globalTotal = 0, globalDone = 0;
  TABS.forEach(t => {
    if (!Array.isArray(t.data)) {
      tabCounts[t.id] = '—';
      return;
    }
    const total = t.data.length;
    const done = t.data.filter(c => getCardState(t.id, cardKey(c)).done).length;
    tabCounts[t.id] = `${done}/${total}`;
    globalTotal += total;
    globalDone += done;
  });

  let html = '';
  GROUPS.forEach(g => {
    html += `<div class="nav-group">
      <div class="nav-group-label">${g.label}</div>`;
    TABS.filter(t => t.group === g.id).forEach(t => {
      html += `<div class="nav-item ${t.id === currentTab ? 'active' : ''}" data-tab="${t.id}">
        <span>${t.name}</span>
        <span class="nav-count">${tabCounts[t.id]}</span>
      </div>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html;

  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => switchTab(el.dataset.tab));
  });

  document.getElementById('stat-global').textContent = `${globalDone}/${globalTotal}`;
}

function renderLegend() {
  const el = document.getElementById('legend');
  const tab = getTab(currentTab);
  if (tab.kind === 'roadmap' || tab.kind === 'cheatsheet' || tab.kind === 'problemlog') { el.innerHTML = ''; return; }
  if (tab.kind === 'confusion' || tab.kind === 'bugs') { el.innerHTML = ''; return; }
  if (tab.kind === 'pattern') {
    // Pattern tab: show difficulty legend
    el.innerHTML = [
      { t: 'easy', c: 'var(--diff-easy)' },
      { t: 'med', c: 'var(--diff-med)' },

    ].map(x => `<div class="legend-item"><div class="legend-dot" style="background:${x.c}"></div>${x.t}</div>`).join('');

  }

    // Arsenal shows tier legend instead of layer legend
    el.innerHTML = [
      { t: 'S', c: '#f87171', l: 'must-know' },
      { t: 'A', c: '#fb923c', l: 'high-impact' },

      L${i+1} ${label}

// ========== PATTERN CROSS-LINK SYSTEM ==========
let _patternReverseIndex = null;  // algo title → [pattern objs]
function patternReverseIndex() {
  if (_patternReverseIndex) return _patternReverseIndex;
  _patternReverseIndex = {};
  const patTab = getTab('patternlib');
  if (!patTab || !Array.isArray(patTab.data)) return _patternReverseIndex;
  for (const p of patTab.data) {
    if (!p.relatedAlgos) continue;
    for (const algoTitle of p.relatedAlgos) {
      if (!_patternReverseIndex[algoTitle]) _patternReverseIndex[algoTitle] = [];
      _patternReverseIndex[algoTitle].push(p);
    }
  }
  return _patternReverseIndex;
}

// Find which tab contains an algo card w/ given title (for chip click → navigate)
function findAlgoTab(title) {
  for (const t of TABS) {
    if (t.kind === 'arsenal' || t.kind === 'pattern') continue;
    if (Array.isArray(t.data) && t.data.some(c => c.title === title)) return t.id;
  }
  return null;
}

function navigateToAlgoCard(title) {
  const tabId = findAlgoTab(title);
  if (!tabId) return;
  switchTab(tabId);
  // Expand the target card
  setTimeout(() => {
    setCardState(tabId, title, { expanded: true });
    render();
    // scroll to card if possible
    const cards = document.querySelectorAll('.card');
    for (const c of cards) {
      const titleEl = c.querySelector('.card-title');
      if (titleEl && titleEl.textContent.trim().endsWith(title)) {
        c.scrollIntoView({ behavior: 'smooth', block: 'center' });
        break;
      }
    }
  }, 50);
}

function navigateToPattern(patternId) {
  switchTab('patternlib');
  setTimeout(() => {
    setCardState('patternlib', patternId, { expanded: true });
    renderPatterns();
    // scroll
    const cards = document.querySelectorAll('.pat-card');
    for (const c of cards) {
      if (c.dataset.patId === patternId) {
        c.scrollIntoView({ behavior: 'smooth', block: 'center' });
        break;
      }
    }
  }, 50);
}

function renderPatterns() {
  const searchTerm = document.getElementById('search').value.toLowerCase().trim();
  const filter = document.querySelector('.filter-btn.active').dataset.filter;
  const tab = getTab(currentTab);
  const data = tab.data;
  const cats = tab.categories;

  document.documentElement.style.setProperty('--theme', getTheme());

  const mapEl = document.getElementById('map');
  mapEl.innerHTML = '';

  let total = 0, done = 0;
  const byCat = {};
  for (const p of data) (byCat[p.cat] = byCat[p.cat] || []).push(p);

  const catIds = Object.keys(cats).map(Number).sort((a, b) => a - b);
  for (const cid of catIds) {
    const catPatterns = byCat[cid] || [];
    const catInfo = cats[cid];

    const visible = catPatterns.filter(p => {
      const cs = getCardState(currentTab, p.id);
      if (filter === 'done' && !cs.done) return false;
      if (filter === 'pending' && cs.done) return false;
      if (searchTerm) {
        const hay = `${p.id} ${p.title} ${p.signal} ${p.coreIdea} ${p.canonicalProblem} ${(p.relatedAlgos||[]).join(' ')}`.toLowerCase();
        if (!hay.includes(searchTerm)) return false;
      }
      return true;
    });

    total += catPatterns.length;
    done += catPatterns.filter(p => getCardState(currentTab, p.id).done).length;

    if (visible.length === 0) continue;

    const catEl = document.createElement('div');
    catEl.className = 'ars-category';
    catEl.innerHTML = `
      <div class="ars-category-header" style="border-left-color: var(--theme-patterns);">
        <span class="ars-category-label" style="background: var(--theme-patterns);">${catInfo.label}</span>
        <span class="ars-category-title">${catInfo.title}</span>
        <span class="ars-category-desc">${catInfo.desc} · ${visible.length}/${catPatterns.length}</span>
      </div>
      <div class="ars-cards"></div>
    `;
    const cardsEl = catEl.querySelector('.ars-cards');

    visible.forEach(p => {
      const cs = getCardState(currentTab, p.id);
      const cardEl = document.createElement('div');
      cardEl.className = `ars-card pat-card ${cs.done ? 'done' : ''} ${cs.expanded ? 'expanded' : ''}`;
      cardEl.dataset.patId = p.id;
      cardEl.style.borderLeftColor = 'var(--theme-patterns)';
      const diffClass = `diff-${p.diff}`;
      cardEl.innerHTML = `
        <div class="ars-card-top">
          <div class="ars-card-title">
            <span class="ars-card-id">${p.id}</span>${escapeHtml(p.title)}
          </div>
          <span class="tag ${diffClass}" style="font-size:10px;">${(p.diff||'').toUpperCase()}</span>
        </div>
        <div class="pat-signal">${escapeHtml(p.signal)}</div>
        <div class="pat-idea">${escapeHtml(p.coreIdea)}</div>
        ${(typeof PATTERN_ANTI_SIGNALS !== 'undefined' && PATTERN_ANTI_SIGNALS[p.id]) ? `<div class="pat-when-not">${escapeHtml(PATTERN_ANTI_SIGNALS[p.id])}</div>` : ''}
        <div class="ars-card-controls">
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);">${cs.expanded ? '▼ hide template' : '▶ show template'}</span>
          <div class="ars-card-check" data-action="toggle-done"></div>
        </div>
        <div class="ars-card-detail">
          <pre class="ars-code">${escapeHtml(p.template)}</pre>
          <div class="detail-row" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:6px;">
            <strong style="color:var(--text);">canonical:</strong> ${escapeHtml(p.canonicalProblem)}
          </div>
          ${p.moreProblems && p.moreProblems.length ? `<div class="detail-row" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:4px;">
            <strong style="color:var(--text);">more:</strong> ${p.moreProblems.map(escapeHtml).join(' · ')}
          </div>` : ''}
          ${p.relatedAlgos && p.relatedAlgos.length ? `<div style="margin-top:8px;"><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);">RELATED ALGOS</span><div class="pat-chips">${p.relatedAlgos.map(a => {
            const tabId = findAlgoTab(a);
            const cls = tabId ? 'pat-chip algo-chip' : 'pat-chip algo-chip unresolved';
            return `<span class="${cls}" data-algo-title="${escapeHtml(a)}" ${tabId ? '' : 'title="not yet built"'}>${escapeHtml(a)}</span>`;
          }).join('')}</div></div>` : ''}
          <button class="dl-btn" data-action="depth-ladder" data-kind="pattern">Depth Ladder</button>
        </div>
      `;

      cardEl.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="depth-ladder"]')) {
          e.stopPropagation();
          openDepthLadder(depthLadderPattern(p), p.title, 'Pattern');
          return;
        }
        const chip = e.target.closest('.algo-chip');
        if (chip && !chip.classList.contains('unresolved')) {
          e.stopPropagation();
          navigateToAlgoCard(chip.dataset.algoTitle);
          return;
        }
        if (e.target.closest('[data-action="toggle-done"]')) {
          setCardState(currentTab, p.id, { done: !cs.done });
          renderPatterns(); renderNav(); return;
        }
        setCardState(currentTab, p.id, { expanded: !cs.expanded });
        renderPatterns();
      });

      cardsEl.appendChild(cardEl);
    });

    mapEl.appendChild(catEl);
  }

  if (document.querySelectorAll('.ars-category').length === 0) {
    if (searchTerm || filter !== 'all') {
      mapEl.innerHTML = '<div class="empty-state">no patterns match — clear search/filter</div>';
    }
  }

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-rem').textContent = total - done;
}


// ========== ROADMAP TAB ==========
function getCurrentPhaseId() {
  return parseInt(localStorage.getItem('roadmap_phase') || '1');
}
function setCurrentPhaseId(n) {
  localStorage.setItem('roadmap_phase', String(n));
}
function getUserRating() {
  return localStorage.getItem('roadmap_rating') || '';
}
function setUserRating(r) {
  if (r) localStorage.setItem('roadmap_rating', r);
  else localStorage.removeItem('roadmap_rating');
}

function phaseProgress(phase) {
  let total = 0, done = 0;
  for (const g of phase.topics) {
    for (const chip of g.chips) {
      total++;
      const resolved = resolveChip(chip);
      if (resolved && getCardState(chip.tab, resolved).done) done++;
    }
  }
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}

function resolveChip(chip) {
  // Returns the card key that exists, or null if unresolved
  const tab = getTab(chip.tab);
  if (!tab || !Array.isArray(tab.data)) return null;
  // For arsenal + pattern tabs, chip.card might be an id like "1.1"
  const byId = tab.data.find(c => c.id === chip.card);
  if (byId) return byId.id;
  const byTitle = tab.data.find(c => c.title === chip.card);
  if (byTitle) return byTitle.title;
  return null;
}

  document.getElementById('stat-done').textContent = globalDone;

function renderChip(chip) {
  const resolved = resolveChip(chip);
  if (!resolved) {
    return `<span class="rm-chip unresolved" title="not yet built">${escapeHtml(chip.card)}</span>`;
  }
  const cs = getCardState(chip.tab, resolved);
  const cls = cs.done ? 'rm-chip done' : 'rm-chip';
  return `<span class="${cls}" data-chip-tab="${chip.tab}" data-chip-key="${escapeHtml(resolved)}">${escapeHtml(chip.card)}</span>`;
}

function openGlobalSearch() {

    const byTab = {};
    for (const tab of TABS) {
      if (tab.kind === 'roadmap' || tab.kind === 'cheatsheet') continue;
      if (!Array.isArray(tab.data)) continue;
      const hits = [];
      for (const card of tab.data) {
        const title = card.title || '';
        const id = card.id || '';
        const desc = card.desc || '';
        const signal = card.signal || '';
        const replaces = card.replaces || '';
        const speedup = card.speedup || '';
        const coreIdea = card.coreIdea || '';
        const hay = `${id} ${title} ${desc} ${signal} ${replaces} ${speedup} ${coreIdea}`.toLowerCase();
        if (hay.includes(q)) hits.push(card);
        if (hits.length >= 20) break;
      }
      if (hits.length) byTab[tab.id] = hits;
    }

    if (Object.keys(byTab).length === 0) {
      resultsEl.innerHTML = '<div style="color:var(--text-faint);font-family:JetBrains Mono,monospace;font-size:11px;padding:10px;">no matches</div>';
      return;
    }

    let html = '';
    for (const tabId of Object.keys(byTab)) {
      const tab = getTab(tabId);
      const hits = byTab[tabId];
      html += `<div class="global-search-group">
        <div class="global-search-group-label">${escapeHtml(tab.name)} · ${hits.length}</div>`;
      for (const card of hits) {
        const k = cardKey(card);
        const cs = getCardState(tabId, k);
        const id = card.id ? `[${card.id}] ` : '';
        html += `<div class="global-search-result" data-tab="${tabId}" data-key="${escapeHtml(k)}">
          <div class="title">${escapeHtml(id)}${escapeHtml(card.title)} ${cs.done ? '<span style="color:var(--tier-1);">✓</span>' : ''}</div>
          <div class="meta">${escapeHtml((card.signal || card.desc || card.replaces || '').substring(0, 100))}</div>
        </div>`;
      }
      html += `</div>`;
    }
    resultsEl.innerHTML = html;

    resultsEl.querySelectorAll('.global-search-result').forEach(el => {
      el.addEventListener('click', () => {
        const tabId = el.dataset.tab;
        const k = el.dataset.key;
        closeModal();
        switchTab(tabId);
        setTimeout(() => {
          setCardState(tabId, k, { expanded: true });
          const t = getTab(tabId);
          if (t.kind === 'arsenal') renderArsenal();
          else if (t.kind === 'pattern') renderPatterns();
          else render();
        }, 50);
      });
    });
  }

  input.addEventListener('input', doSearch);
  input.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

// ========== POLISH: NEXT-UP ==========
function openNextUp() {
  const backdrop = document.getElementById('modal-backdrop');
  const body = document.getElementById('modal-body');
  const tab = getTab(currentTab);
  const cards = (tab && Array.isArray(tab.data) && tab.kind !== 'roadmap' && tab.kind !== 'cheatsheet') ? tab.data : [];

  // Score cards: not done, prereqs-met (if any), low confidence
  const doneSet = new Set();
  for (const c of cards) if (getCardState(currentTab, cardKey(c)).done) doneSet.add(c.title);

  const candidates = cards.filter(c => {
    const cs = getCardState(currentTab, cardKey(c));
    if (cs.done) return false;
    if (c.prereqs && c.prereqs.length) {
      for (const p of c.prereqs) if (!doneSet.has(p)) return false;
    }
    return true;
  });

  // Rank: lower layer > lower difficulty > higher confidence (to finish started)
  const diffRank = { easy: 0, med: 1, hard: 2, gm: 3 };
  candidates.sort((a, b) => {
    if (a.layer !== b.layer) return (a.layer || 99) - (b.layer || 99);
    const da = diffRank[a.diff] ?? 99;
    const db = diffRank[b.diff] ?? 99;
    if (da !== db) return da - db;
    const ca = getCardState(currentTab, cardKey(a)).confidence || 0;
    const cb = getCardState(currentTab, cardKey(b)).confidence || 0;
    return cb - ca;
  });

  const top = candidates.slice(0, 6);

  body.innerHTML = `
    <h3>Next Up — ${escapeHtml(tab ? tab.name : '')}</h3>
    <div style="font-family:JetBrains Mono,monospace;font-size:11px;color:var(--text-dim);margin-bottom:12px;">
      cards w/ prereqs met · not done · click to jump
    </div>
    ${top.length === 0 ? '<div style="color:var(--text-faint);padding:10px;">nothing unlocked — mark more prereqs done or switch tabs</div>' :
      top.map(c => {
        const cs = getCardState(currentTab, cardKey(c));
        const id = c.id ? `[${c.id}] ` : '';
        const layer = c.layer ? `L${c.layer} · ` : '';
        return `<div class="next-up-item" data-key="${escapeHtml(cardKey(c))}">
          <div class="title">${escapeHtml(id)}${escapeHtml(c.title)}</div>
          <div class="meta">${layer}${escapeHtml(c.diff || '')} · ${escapeHtml(c.signal || c.desc || c.replaces || '').substring(0, 80)}${cs.confidence ? ' · conf '+cs.confidence+'/5' : ''}</div>
        </div>`;
      }).join('')}
  `;
  backdrop.classList.add('open');

  body.querySelectorAll('.next-up-item').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.key;
      closeModal();
      setCardState(currentTab, k, { expanded: true });
      const t = getTab(currentTab);
      if (t.kind === 'arsenal') renderArsenal();
      else if (t.kind === 'pattern') renderPatterns();
      else render();
    });
  });
}

  for (const cid of catIds) {
