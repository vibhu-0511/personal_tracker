function renderCheatsheet() {
  const searchTerm = document.getElementById('search').value.toLowerCase().trim();
  const tab = getTab(currentTab);
  const data = tab.data;

  document.documentElement.style.setProperty('--theme', getTheme());
  const mapEl = document.getElementById('map');

  function filterRows(rows) {
    if (!searchTerm) return rows;
    return rows.filter(r => r.some(c => String(c).toLowerCase().includes(searchTerm)));
  }

  const dsRows = filterRows(data.dsTable.rows);
  const algoRows = filterRows(data.algoTable.rows);

  mapEl.innerHTML = `
    <div class="cs-section">
      <div class="cs-title">${escapeHtml(data.dsTable.title)}</div>
      <table class="cs-table">
        <thead><tr><th>Structure</th>${data.dsTable.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>${dsRows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="cs-section">
      <div class="cs-title">${escapeHtml(data.algoTable.title)}</div>
      <table class="cs-table">
        <thead><tr><th>Algorithm</th>${data.algoTable.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>${algoRows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
  `;

  document.getElementById('stat-total').textContent = data.dsTable.rows.length + data.algoTable.rows.length;
  document.getElementById('stat-done').textContent = '—';
  document.getElementById('stat-rem').textContent = '—';
}


// ========== PROBLEM LOG ==========
const PROBLEM_LOG_KEY = 'mastery_map_problems';
let _logCache = null;

function loadLog() {
  if (_logCache) return _logCache;
  try {
    const raw = localStorage.getItem(PROBLEM_LOG_KEY);
    _logCache = raw ? JSON.parse(raw) : [];
  } catch (e) {
    _logCache = [];
  }
  return _logCache;
}
function saveLog() {
  localStorage.setItem(PROBLEM_LOG_KEY, JSON.stringify(_logCache || []));
}
function uid() { return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

const LOG_STATUS_LABEL = {
  'todo': 'TODO',
  'attempted': 'Attempted',
  'solved': 'Solved',
  'upsolved': 'Upsolved',
  'giving-up': 'Giving up'
};

let logFilter = { search: '', status: 'all', tag: null };
let logSort = 'date-desc';
let logEditingId = null;

function renderProblemLog() {
  document.documentElement.style.setProperty('--theme', getTheme());
  const mapEl = document.getElementById('map');
  const problems = loadLog();

  // Stats
  const stats = { total: problems.length, solved: 0, upsolved: 0, attempted: 0, todo: 0, giving: 0 };
  const tagCount = {};
  for (const p of problems) {
    if (p.status === 'solved') stats.solved++;
    else if (p.status === 'upsolved') stats.upsolved++;
    else if (p.status === 'attempted') stats.attempted++;
    else if (p.status === 'todo') stats.todo++;
    else if (p.status === 'giving-up') stats.giving++;
    if (p.tag) {
      for (const t of p.tag.split(',').map(s => s.trim()).filter(Boolean)) {
        tagCount[t] = (tagCount[t] || 0) + 1;
      }
    }
  }
  const topTags = Object.entries(tagCount).sort((a,b) => b[1] - a[1]).slice(0, 20);

  // Filtered
  let filtered = problems.slice();
  const q = logFilter.search.toLowerCase().trim();
  if (q) {
    filtered = filtered.filter(p => {
      const hay = `${p.pid || ''} ${p.title || ''} ${p.tag || ''} ${p.notes || ''}`.toLowerCase();
      return hay.includes(q);
    });
  }
  if (logFilter.status !== 'all') filtered = filtered.filter(p => p.status === logFilter.status);
  if (logFilter.tag) filtered = filtered.filter(p => (p.tag || '').split(',').map(s => s.trim()).includes(logFilter.tag));

  // Sort
  filtered.sort((a, b) => {
    if (logSort === 'date-desc') return (b.createdAt || 0) - (a.createdAt || 0);
    if (logSort === 'date-asc') return (a.createdAt || 0) - (b.createdAt || 0);
    if (logSort === 'diff-desc') return (b.diff || '').localeCompare(a.diff || '');
    if (logSort === 'diff-asc') return (a.diff || '').localeCompare(b.diff || '');
    if (logSort === 'status') return (a.status || '').localeCompare(b.status || '');
    return 0;
  });

  mapEl.innerHTML = `
    <div class="log-toolbar">
      <button class="log-add-btn" id="log-add">+ Add Problem</button>
      <input class="log-search" id="log-search" placeholder="search pid/title/tag/notes..." value="${escapeHtml(logFilter.search)}" />
      <select class="log-filter" id="log-status-filter">
        <option value="all" ${logFilter.status==='all'?'selected':''}>All statuses</option>
        <option value="todo" ${logFilter.status==='todo'?'selected':''}>TODO</option>
        <option value="attempted" ${logFilter.status==='attempted'?'selected':''}>Attempted</option>
        <option value="solved" ${logFilter.status==='solved'?'selected':''}>Solved</option>
        <option value="upsolved" ${logFilter.status==='upsolved'?'selected':''}>Upsolved</option>
        <option value="giving-up" ${logFilter.status==='giving-up'?'selected':''}>Giving up</option>
      </select>
      <select class="log-filter" id="log-sort">
        <option value="date-desc" ${logSort==='date-desc'?'selected':''}>Newest first</option>
        <option value="date-asc" ${logSort==='date-asc'?'selected':''}>Oldest first</option>
        <option value="diff-desc" ${logSort==='diff-desc'?'selected':''}>Hardest first</option>
        <option value="diff-asc" ${logSort==='diff-asc'?'selected':''}>Easiest first</option>
        <option value="status" ${logSort==='status'?'selected':''}>By status</option>
      </select>
      <button class="log-export-btn" id="log-export-csv">Export CSV</button>
      <button class="log-import-btn" id="log-import-json">Import JSON</button>
    </div>

    <div class="log-stats">
      <strong>${stats.total}</strong> total ·
      <span class="done-c"><strong>${stats.solved}</strong> solved</span> ·
      <span class="done-c"><strong>${stats.upsolved}</strong> upsolved</span> ·
      <span class="todo-c"><strong>${stats.attempted}</strong> attempted</span> ·
      <strong>${stats.todo}</strong> todo ·
      <span class="skip-c"><strong>${stats.giving}</strong> giving up</span>
    </div>

    ${topTags.length ? `<div class="log-tags">
      <span class="log-tag-chip ${!logFilter.tag ? 'active' : ''}" data-tag="">all tags</span>
      ${topTags.map(([t, n]) => `<span class="log-tag-chip ${logFilter.tag===t?'active':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}<span class="count">${n}</span></span>`).join('')}
    </div>` : ''}

    <div class="log-table" id="log-table">
      ${filtered.length === 0 ? '<div class="log-empty">no problems logged — click "+ Add Problem" to start</div>' :
        filtered.map(p => renderLogEntry(p)).join('')}
    </div>
  `;

  // Global stat bar
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-done').textContent = stats.solved + stats.upsolved;
  document.getElementById('stat-rem').textContent = stats.todo + stats.attempted;

  // Wire toolbar
  document.getElementById('log-add').addEventListener('click', () => {
    openLogEdit(null);
  });
  document.getElementById('log-search').addEventListener('input', (e) => {
    logFilter.search = e.target.value;
    renderProblemLog();
    document.getElementById('log-search').focus();
  });
  document.getElementById('log-status-filter').addEventListener('change', (e) => {
    logFilter.status = e.target.value;
    renderProblemLog();
  });
  document.getElementById('log-sort').addEventListener('change', (e) => {
    logSort = e.target.value;
    renderProblemLog();
  });
  document.getElementById('log-export-csv').addEventListener('click', exportLogCSV);
  document.getElementById('log-import-json').addEventListener('click', openLogImport);

  // Tag chips
  mapEl.querySelectorAll('.log-tag-chip').forEach(el => {
    el.addEventListener('click', () => {
      logFilter.tag = el.dataset.tag || null;
      renderProblemLog();
    });
  });

  // Row clicks
  mapEl.querySelectorAll('.log-entry').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-act]')) return;
      el.classList.toggle('expanded');
    });
    // action buttons
    el.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        const pid = el.dataset.id;
        if (act === 'edit') openLogEdit(pid);
        else if (act === 'delete') {
          if (confirm('Delete this entry?')) {
            _logCache = _logCache.filter(x => x.id !== pid);
            saveLog();
            renderProblemLog();
          }
        } else if (act === 'status-cycle') {
          const order = ['todo', 'attempted', 'solved', 'upsolved', 'giving-up'];
          const p = _logCache.find(x => x.id === pid);
          if (p) {
            const i = order.indexOf(p.status || 'todo');
            p.status = order[(i + 1) % order.length];
            p.updatedAt = Date.now();
            saveLog();
            renderProblemLog();
          }
        } else if (act === 'open-link') {
          const p = _logCache.find(x => x.id === pid);
          if (p && p.link) window.open(p.link, '_blank');
        }
      });
    });
  });
}

function renderLogEntry(p) {
  const date = p.createdAt ? new Date(p.createdAt).toISOString().slice(0, 10) : '';
  const statusCls = 'status-' + (p.status || 'todo');
  const notesPreview = p.notes ? (p.notes.length > 80 ? p.notes.slice(0, 80) + '...' : p.notes) : '';
  return `<div class="log-entry ${statusCls}" data-id="${p.id}">
    <div class="log-pid">${escapeHtml(p.pid || '(no id)')}</div>
    <div class="log-title-col">${escapeHtml(p.title || '(no title)')}${p.tag ? `<span class="ptag">${escapeHtml(p.tag.split(',')[0].trim())}${p.tag.split(',').length > 1 ? '+'+(p.tag.split(',').length-1) : ''}</span>` : ''}</div>
    <span class="log-diff">${escapeHtml(p.diff || '—')}</span>
    <span class="log-status" data-act="status-cycle" title="click to cycle status">${LOG_STATUS_LABEL[p.status] || 'TODO'}</span>
    <div class="log-entry-body">
      <div class="log-notes ${p.notes ? '' : 'empty'}">${escapeHtml(p.notes || '(no notes — click Edit to add)')}</div>
      <div class="log-meta">
        added ${date}${p.link ? ' · ' : ''}${p.link ? `<a href="${escapeHtml(p.link)}" target="_blank" rel="noopener" style="color:var(--theme-log);">${escapeHtml(p.link)}</a>` : ''}
        ${p.tag ? ` · tags: <span style="color:var(--text-dim);">${escapeHtml(p.tag)}</span>` : ''}
      </div>
      <div class="log-actions-row">
        <button class="log-action-btn" data-act="edit">Edit</button>
        ${p.link ? '<button class="log-action-btn" data-act="open-link">Open link</button>' : ''}
        <button class="log-action-btn danger" data-act="delete">Delete</button>
      </div>
    </div>
  </div>`;
}

function openLogEdit(id) {
  const backdrop = document.getElementById('modal-backdrop');
  const body = document.getElementById('modal-body');
  const problems = loadLog();
  const p = id ? problems.find(x => x.id === id) : {
    id: uid(), pid: '', title: '', diff: '', status: 'todo', tag: '', notes: '', link: '',
    createdAt: Date.now(), updatedAt: Date.now()
  };
  const isNew = !id;
  body.innerHTML = `
    <h3>${isNew ? 'Add' : 'Edit'} Problem</h3>
    <div class="log-edit-grid">
      <label>Problem ID</label>
      <input id="log-edit-pid" placeholder="e.g. CF 1234E, LC 239" value="${escapeHtml(p.pid || '')}" />
      <label>Title</label>
      <input id="log-edit-title" placeholder="problem name (optional)" value="${escapeHtml(p.title || '')}" />
      <label>Difficulty</label>
      <input id="log-edit-diff" placeholder="e.g. 1800, hard, Div2 D" value="${escapeHtml(p.diff || '')}" />
      <label>Status</label>
      <select id="log-edit-status">
        <option value="todo" ${p.status==='todo'?'selected':''}>TODO</option>
        <option value="attempted" ${p.status==='attempted'?'selected':''}>Attempted</option>
        <option value="solved" ${p.status==='solved'?'selected':''}>Solved</option>
        <option value="upsolved" ${p.status==='upsolved'?'selected':''}>Upsolved</option>
        <option value="giving-up" ${p.status==='giving-up'?'selected':''}>Giving up</option>
      </select>
      <label>Tags</label>
      <input id="log-edit-tag" placeholder="comma-separated: dp, bitmask, trick" value="${escapeHtml(p.tag || '')}" />
      <label>Link</label>
      <input id="log-edit-link" placeholder="https://..." value="${escapeHtml(p.link || '')}" />
      <label>Notes</label>
      <textarea id="log-edit-notes" placeholder="pattern/trick/insight — what made this problem click">${escapeHtml(p.notes || '')}</textarea>
    </div>
    <div class="polish-actions">
      <button class="polish-action-btn secondary" id="log-edit-cancel">Cancel</button>
      <button class="polish-action-btn" id="log-edit-save">${isNew ? 'Add' : 'Save'}</button>
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('log-edit-pid').focus();

  document.getElementById('log-edit-cancel').addEventListener('click', closeModal);
  document.getElementById('log-edit-save').addEventListener('click', () => {
    p.pid = document.getElementById('log-edit-pid').value.trim();
    p.title = document.getElementById('log-edit-title').value.trim();
    p.diff = document.getElementById('log-edit-diff').value.trim();
    p.status = document.getElementById('log-edit-status').value;
    p.tag = document.getElementById('log-edit-tag').value.trim();
    p.link = document.getElementById('log-edit-link').value.trim();
    p.notes = document.getElementById('log-edit-notes').value;
    p.updatedAt = Date.now();

    if (!p.pid && !p.title) {
      alert('Either Problem ID or Title is required');
      return;
    }

    if (isNew) {
      _logCache = loadLog();
      _logCache.push(p);
    }
    saveLog();
    closeModal();
    renderProblemLog();
    renderNav();
  });
}

function exportLogCSV() {
  const problems = loadLog();
  if (problems.length === 0) { showToast('No problems to export'); return; }
  const esc = s => `"${String(s || '').replace(/"/g, '""')}"`;
  const header = ['Problem ID', 'Title', 'Difficulty', 'Status', 'Tags', 'Notes', 'Link', 'Date Added'];
  const rows = problems.map(p => [
    p.pid, p.title, p.diff, LOG_STATUS_LABEL[p.status] || p.status,
    p.tag, p.notes, p.link,
    p.createdAt ? new Date(p.createdAt).toISOString().slice(0, 10) : ''
  ].map(esc).join(','));
  const csv = [header.map(esc).join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `problem_log_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('CSV downloaded');
}

function openLogImport() {
  const backdrop = document.getElementById('modal-backdrop');
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h3>Import Problem Log</h3>
    <div style="font-family:JetBrains Mono,monospace;font-size:11px;color:var(--text-dim);margin-bottom:10px;">
      paste JSON array of problem objects. will MERGE with existing (no duplicates by pid).
    </div>
    <textarea class="polish-textarea" id="log-import-ta" placeholder='[{"pid":"CF 1234E","title":"..."}, ...]'></textarea>
    <div class="polish-actions">
      <button class="polish-action-btn secondary" id="log-import-cancel">Cancel</button>
      <button class="polish-action-btn" id="log-import-apply">Import (merge)</button>
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('log-import-cancel').addEventListener('click', closeModal);
  document.getElementById('log-import-apply').addEventListener('click', () => {
    const txt = document.getElementById('log-import-ta').value.trim();
    try {
      const arr = JSON.parse(txt);
      if (!Array.isArray(arr)) throw new Error('not an array');
      const existing = loadLog();
      const pidSet = new Set(existing.filter(p => p.pid).map(p => p.pid));
      let added = 0;
      for (const item of arr) {
        if (item.pid && pidSet.has(item.pid)) continue;
        item.id = item.id || uid();
        item.createdAt = item.createdAt || Date.now();
        item.status = item.status || 'todo';
        existing.push(item);
        if (item.pid) pidSet.add(item.pid);
        added++;
      }
      _logCache = existing;
      saveLog();
      closeModal();
      showToast(`Imported ${added} problems`);
      renderProblemLog();
    } catch (e) {
      alert('Invalid JSON: ' + e.message);
    }
  });
}

function cardKey(card) {
  return card.id || card.title; // arsenal uses id, others use title
}

function renderArsenal() {
  const searchTerm = document.getElementById('search').value.toLowerCase().trim();
  const filter = document.querySelector('.filter-btn.active').dataset.filter;
  const tab = getTab(currentTab);
  const data = tab.data;
  const cats = tab.categories;

  document.documentElement.style.setProperty('--theme', getTheme());

  const mapEl = document.getElementById('map');
  mapEl.innerHTML = '';

  let total = 0, done = 0;

  // Group by category
  const byCat = {};
  for (const card of data) {
    (byCat[card.cat] = byCat[card.cat] || []).push(card);
  }

  const catIds = Object.keys(cats).map(Number).sort((a, b) => a - b);
  for (const cid of catIds) {
    const catCards = byCat[cid] || [];
    const catInfo = cats[cid];

    const visible = catCards.filter(card => {
      const cs = getCardState(currentTab, cardKey(card));
      if (filter === 'done' && !cs.done) return false;
      if (filter === 'pending' && cs.done) return false;
      if (searchTerm) {
        const hay = `${card.id} ${card.title} ${card.tier} ${card.replaces} ${card.speedup} ${card.whenToUse}`.toLowerCase();
        if (!hay.includes(searchTerm)) return false;
      }
      return true;
    });

    total += catCards.length;
    done += catCards.filter(c => getCardState(currentTab, cardKey(c)).done).length;

    if (visible.length === 0) continue;

    const catEl = document.createElement('div');
    catEl.className = 'ars-category';
    catEl.innerHTML = `
      <div class="ars-category-header">
        <span class="ars-category-label">${catInfo.label}</span>
        <span class="ars-category-title">${catInfo.title}</span>
        <span class="ars-category-desc">${catInfo.desc} · ${visible.length}/${catCards.length}</span>
      </div>
      <div class="ars-cards"></div>
    `;
    const cardsEl = catEl.querySelector('.ars-cards');

    visible.forEach(card => {
      const cs = getCardState(currentTab, cardKey(card));
      const cardEl = document.createElement('div');
      cardEl.className = `ars-card tier-${card.tier} ${cs.done ? 'done' : ''} ${cs.expanded ? 'expanded' : ''}`;
      cardEl.innerHTML = `
        <div class="ars-card-top">
          <div class="ars-card-title">
            <span class="ars-card-id">${card.id}</span>${escapeHtml(card.title)}
          </div>
          <div class="ars-tier-badge tier-${card.tier}">${card.tier}</div>
        </div>
        <div class="ars-card-meta">
          <span class="k">replaces:</span><span class="v">${escapeHtml(card.replaces)}</span>
          <span class="k">speedup:</span><span class="v">${escapeHtml(card.speedup)}</span>
          <span class="k">use when:</span><span class="v">${escapeHtml(card.whenToUse)}</span>
        </div>
        <div class="ars-card-controls">
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);">${cs.expanded ? '▼ hide code' : '▶ show code'}</span>
          <div class="ars-card-check" data-action="toggle-done"></div>
        </div>
        <div class="ars-card-detail">
          <pre class="ars-code">${escapeHtml(card.code)}</pre>
          ${card.gotchas ? `<div class="ars-gotchas"><strong>gotchas:</strong> ${escapeHtml(card.gotchas)}</div>` : ''}
          ${card.appliedIn && card.appliedIn.length ? `<div class="ars-applied-in"><strong>applied in:</strong> ${card.appliedIn.map(escapeHtml).join(' · ')}</div>` : ''}
          <button class="dl-btn" data-action="depth-ladder" data-kind="arsenal">Depth Ladder</button>
        </div>
      `;

      cardEl.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="depth-ladder"]')) {
          e.stopPropagation();
          const cardObj = card;
          const tabObj = getTab(currentTab);
          if (tabObj.kind === 'arsenal') openDepthLadder(depthLadderArsenal(cardObj), cardObj.title, 'Arsenal');
          else openDepthLadder(depthLadderAlgo(cardObj, tabObj), cardObj.title, 'Algorithm');
          return;
        }
        const patChip = e.target.closest('[data-pat-id]');
        if (patChip) {
          e.stopPropagation();
          navigateToPattern(patChip.dataset.patId);
          return;
        }
        if (e.target.closest('[data-action="toggle-done"]')) {
          setCardState(currentTab, cardKey(card), { done: !cs.done });
          renderArsenal(); renderNav(); return;
        }
        setCardState(currentTab, cardKey(card), { expanded: !cs.expanded });
        renderArsenal();
      });

      cardsEl.appendChild(cardEl);
    });

    mapEl.appendChild(catEl);
  }

  if (document.querySelectorAll('.ars-category').length === 0) {
    if (searchTerm || filter !== 'all') {
      mapEl.innerHTML = '<div class="empty-state">no cards match — clear search/filter</div>';
    }
  }

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-rem').textContent = total - done;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function render() {
  const searchTerm = document.getElementById('search').value.toLowerCase().trim();
  const filter = document.querySelector('.filter-btn.active').dataset.filter;
  const data = getData();
  const layers = getLayers();

  // Update theme CSS var
  document.documentElement.style.setProperty('--theme', getTheme());

  const mapEl = document.getElementById('map');
  mapEl.innerHTML = '';

  let total = 0, done = 0;

  for (let L = 1; L <= 7; L++) {
    const layerCards = data.filter(c => c.layer === L);
    const layerInfo = layers[L];
    if (!layerInfo) continue;

    const visibleCards = layerCards.filter(card => {
      const cs = getCardState(currentTab, card.title);
      if (filter === 'done' && !cs.done) return false;
      if (filter === 'pending' && cs.done) return false;
      if (searchTerm) {
        const haystack = `${card.title} ${card.desc} ${card.signal} ${card.diff} ${(card.prereqs||[]).join(' ')}`.toLowerCase();
        if (!haystack.includes(searchTerm)) return false;
      }
      return true;
    });

    total += layerCards.length;
    done += layerCards.filter(c => getCardState(currentTab, c.title).done).length;

    if (visibleCards.length === 0) continue;

    const layerEl = document.createElement('div');
    layerEl.className = `layer tier-${L}`;
    layerEl.innerHTML = `
      <div class="layer-header">
        <span class="layer-label">${layerInfo.label}</span>
        <span class="layer-title">${layerInfo.title}</span>
        <span class="layer-desc">${layerInfo.desc} · ${visibleCards.length}/${layerCards.length}</span>
      </div>
      <div class="cards"></div>
    `;
    const cardsEl = layerEl.querySelector('.cards');

    visibleCards.forEach(card => {
      const cs = getCardState(currentTab, card.title);
      const cardEl = document.createElement('div');
      cardEl.className = `card tier-${L} ${cs.done ? 'done' : ''} ${cs.expanded ? 'expanded' : ''}`;
      cardEl.innerHTML = `
        <div class="card-top">
          <div class="card-title"><span class="dot"></span>${card.title}</div>
          <div class="card-check" data-action="toggle-done"></div>
        </div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-tags">
          <span class="tag diff-${card.diff}">${card.diff.toUpperCase()}</span>
          <span class="tag signal">→ ${card.signal}</span>
          <span class="tag">${card.tc}</span>
        </div>
        <div class="card-bottom">
          <div class="prereq">${card.prereqs.length ? 'needs: <span>' + card.prereqs.join(', ') + '</span>' : '<span style="color:var(--text-faint)">— no prereq</span>'}</div>
          <div class="confidence" data-action="confidence">
            ${[1,2,3,4,5].map(n => `<div class="conf-dot ${n <= cs.confidence ? 'filled' : ''}" data-n="${n}"></div>`).join('')}
          </div>
        </div>
        <div class="card-detail">
          <div class="recurrence">${card.recurrence}</div>
          <div class="detail-row"><strong>problems:</strong> ${card.problems.join(' · ')}</div>
          <div class="detail-row"><strong>complexity:</strong> ${card.tc}</div>
          ${(() => {
            const pats = patternReverseIndex()[card.title];
            if (!pats || pats.length === 0) return '';
            return `<div class="algo-related-patterns"><span class="label">related patterns:</span>` +
              pats.map(p => `<span class="pat-chip" data-pat-id="${p.id}" style="cursor:pointer;">${p.id} ${escapeHtml(p.title)}</span>`).join(' ') +
              `</div>`;
          })()}
          <button class="dl-btn" data-action="depth-ladder">Depth Ladder</button>
        </div>
      `;

      cardEl.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="depth-ladder"]')) {
          e.stopPropagation();
          const cardObj = card;
          const tabObj = getTab(currentTab);
          if (tabObj.kind === 'arsenal') openDepthLadder(depthLadderArsenal(cardObj), cardObj.title, 'Arsenal');
          else openDepthLadder(depthLadderAlgo(cardObj, tabObj), cardObj.title, 'Algorithm');
          return;
        }
        const patChip = e.target.closest('[data-pat-id]');
        if (patChip) {
          e.stopPropagation();
          navigateToPattern(patChip.dataset.patId);
          return;
        }
        if (e.target.closest('[data-action="toggle-done"]')) {
          setCardState(currentTab, card.title, { done: !cs.done });
          render();
          renderNav();
          return;
        }
        if (e.target.closest('[data-action="confidence"]')) {
          const dot = e.target.closest('.conf-dot');
          if (dot) {
            const n = parseInt(dot.dataset.n);
            const newVal = cs.confidence === n ? n - 1 : n;
            setCardState(currentTab, card.title, { confidence: newVal });
            render();
          }
          return;
        }
        setCardState(currentTab, card.title, { expanded: !cs.expanded });
        render();
      });

      cardsEl.appendChild(cardEl);
    });

    mapEl.appendChild(layerEl);
  }

  if (total === 0 || document.querySelectorAll('.layer').length === 0) {
    if (searchTerm || filter !== 'all') {
      mapEl.innerHTML = '<div class="empty-state">no cards match — clear search/filter</div>';
    }
  }

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-rem').textContent = total - done;
}

function switchTab(tab) {
  if (!getTab(tab)) return;
  currentTab = tab;
  localStorage.setItem('mastery_tab', tab);
  const t = getTab(tab);
  document.getElementById('main-title').innerHTML = `${t.name}<span class="accent">.</span>`;
  document.getElementById('main-sub').textContent = `CM Protocol v2.1 · ${t.name}`;
  renderNav();
  renderLegend();
  if (t.kind === 'arsenal') renderArsenal();
  else if (t.kind === 'pattern') renderPatterns();
  else if (t.kind === 'roadmap') renderRoadmap();
  else if (t.kind === 'confusion') renderConfusion();
  else if (t.kind === 'bugs') renderBugs();
  else if (t.kind === 'cheatsheet') renderCheatsheet();
  else if (t.kind === 'problemlog') renderProblemLog();
  else render();
}

/* ==========================================================
   EVENTS
   ========================================================== */
document.getElementById('search').addEventListener('input', () => {
  const t = getTab(currentTab);
  if (t && t.kind === 'arsenal') renderArsenal();
  else if (t && t.kind === 'pattern') renderPatterns();
  else if (t && t.kind === 'roadmap') renderRoadmap();
  else if (t && t.kind === 'confusion') renderConfusion();
  else if (t && t.kind === 'bugs') renderBugs();
  else if (t && t.kind === 'cheatsheet') renderCheatsheet();
  else if (t && t.kind === 'problemlog') renderProblemLog();
  else render();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const t = getTab(currentTab);
    if (t && t.kind === 'arsenal') renderArsenal();
    else if (t && t.kind === 'pattern') renderPatterns();
    else if (t && t.kind === 'roadmap') renderRoadmap();
    else if (t && t.kind === 'confusion') renderConfusion();
    else if (t && t.kind === 'bugs') renderBugs();
    else if (t && t.kind === 'cheatsheet') renderCheatsheet();
    else if (t && t.kind === 'problemlog') renderProblemLog();
    else render();
  });
});

// Keyboard: 1-9 → tabs 1-9, 0 → tab 10, a-m → tabs 11-23
document.addEventListener('keydown', (e) => {
  const inInput = document.activeElement.tagName === 'INPUT';
  if (e.key === '/' && !inInput) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (!inInput) {
    let idx = -1;
    if (/^[1-9]$/.test(e.key)) idx = parseInt(e.key) - 1;
    else if (e.key === '0') idx = 9;
    else if (/^[a-m]$/.test(e.key)) idx = 10 + (e.key.charCodeAt(0) - 'a'.charCodeAt(0));
    if (idx >= 0 && TABS[idx]) switchTab(TABS[idx].id);
  }
  if (e.key === 'Escape' && document.activeElement.id === 'search') {
    document.getElementById('search').blur();
  }
});

/* ==========================================================
   INIT
   ========================================================== */

// ========== POLISH BUTTON WIRING ==========
document.getElementById('btn-global-search').addEventListener('click', openGlobalSearch);
document.getElementById('btn-next-up').addEventListener('click', openNextUp);
document.getElementById('btn-export').addEventListener('click', openExport);
document.getElementById('btn-import').addEventListener('click', openImport);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});
// Shift+/ opens global search
document.addEventListener('keydown', (e) => {
  if (e.key === '?' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    openGlobalSearch();
  }
  if (e.key === 'Escape' && document.getElementById('modal-backdrop').classList.contains('open')) {
    closeModal();
  }
});

switchTab(currentTab);
</script>
</body>
